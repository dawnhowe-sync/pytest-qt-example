name: CI

on:
  workflow_dispatch:
  push:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # python-version: [ '3.9', '3.10', '3.11', '3.12', '3.13', '3.14' ]
        python-version: [ '3.9' ]
    steps:
    - uses: actions/checkout@v2

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}

     - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libx11-6 libxcb1 libxrandr2 libxkbcommon0 libxi6 xvfb

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint
      run: |
        pylint *.py

    - name: Run tests
      run: |
        xvfb-run pytest --maxfail=5 --disable-warnings
        xvfb-run pytest --cov-report xml --cov messageboxex

